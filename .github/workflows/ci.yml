name: Build and test

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --${{ matrix.os == 'windows-2022' && 'win' || matrix.os == 'ubuntu-22.04' && 'linux' || 'mac' }} --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
